name: CI - Build and push Docker images - PHP Service

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - 'php-service/**'
      - '.github/workflows/docker-build-push-image-php-service.yml'

jobs:
  test:
    # Pull requests touching php-service, or a master commit whose message says "build php-service".
    if: github.event_name == 'pull_request' || contains(toJson(github), 'build php-service')
    name: Run PHPUnit tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: php-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/books_test
        run: vendor/bin/phpunit

  build:
    if: github.event_name == 'push' && contains(toJson(github), 'build php-service')
    needs: test
    name: Build Docker Image and Publish to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./php-service
          file: ./php-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: fielcapao/microservices-design-patterns-php-service:latest
          build-args: |
            PORT=8088

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
