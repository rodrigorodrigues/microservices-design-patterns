name: Claude Issue Assistant

"on":
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write
  actions: read

jobs:
  auto-help:
    if: |
      github.event_name == 'issues' &&
      (contains(github.event.issue.labels.*.name, 'help-wanted') ||
       contains(github.event.issue.labels.*.name, 'question') ||
       contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Help with this GitHub issue for microservices-design-patterns, a polyglot
            microservices repo (Java/Spring Boot, Kotlin, Scala, Node.js, Python, Go,
            Rust, .NET, MongoDB, Consul, Docker/Kubernetes, React, OAuth2/JWT). Provide:
            1) understanding of what's being asked, 2) relevant services/files,
            3) actionable next steps, 4) links to relevant docs in this repo if any.

  claude-qa:
    if: |
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
